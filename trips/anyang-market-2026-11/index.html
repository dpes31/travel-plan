    const reduceMotion=window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches;
    filters.scrollIntoView({behavior:reduceMotion?"auto":"smooth",block:"start"});
    const selected=filters.querySelector('[data-category="'+category+'"]');
    if(selected)selected.focus({preventScroll:true});
  }
}
function renderFilters(){
  filters.replaceChildren();
  CATEGORIES.forEach(cat=>{
    const btn=make("button","filter"+(cat.id===activeCategory?" active":""),cat.label);
    btn.type="button";
    btn.dataset.category=cat.id;
    btn.setAttribute("aria-pressed",String(cat.id===activeCategory));
    btn.addEventListener("click",function(){selectCategory(cat.id,false);});
    filters.append(btn);
  });
  document.querySelectorAll(".category-jump").forEach(btn=>{
    btn.setAttribute("aria-pressed",String(btn.dataset.category===activeCategory));
  });
}
function renderPlaces(){
  renderFilters();
  const chosen=picked.map(id=>PLACES.find(place=>place.id===id)).filter(Boolean);
  document.querySelector("#picked-count").textContent=chosen.length+"곳";
  document.querySelector("#quick-count").textContent=String(chosen.length);
  document.querySelector("#quick-nav").classList.toggle("show",chosen.length>0);
  if(chosen.length){
    const list=make("div","place-list");
    chosen.forEach((place,index)=>list.append(makePlace(place,index,true)));
    pickedContent.replaceChildren(list);
  }else{
    pickedContent.replaceChildren(make("div","picked-empty","아래 후보에서 ‘이곳 선택’을 눌러보세요."));
  }
  const unselected=PLACES.filter(place=>!picked.includes(place.id)&&matches(place));
  document.querySelector("#candidate-count").textContent=unselected.length+"곳";
  if(unselected.length){
    const list=make("div","place-list");
    unselected.forEach((place,index)=>list.append(makePlace(place,index,false)));
    candidateContent.replaceChildren(list);
  }else{
    candidateContent.replaceChildren(make("div","empty",PLACES.length===picked.length?"모든 장소를 선택했습니다.":"이 조건에 해당하는 미선택 후보가 없습니다."));
  }
}
function saveScroll(){try{sessionStorage.setItem(POSITION_KEY,String(window.scrollY));}catch(_){}}
function restoreScroll(){
  try{
    const value=sessionStorage.getItem(POSITION_KEY);
    if(value!==null){
      sessionStorage.removeItem(POSITION_KEY);
      requestAnimationFrame(()=>window.scrollTo(0,Math.max(0,Number(value)||0)));
    }
  }catch(_){}
}
document.querySelectorAll(".category-jump").forEach(button=>{
  button.addEventListener("click",()=>selectCategory(button.dataset.category,true));
});
window.addEventListener("pagehide",saveScroll);
window.addEventListener("pageshow",function(event){if(event.persisted)restoreScroll();});
picked=loadPicked();
renderPlaces();
restoreScroll();
</script>
</body>
</html>
